<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>星语的100个智能体</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 固定模块：暖心智能体生态系统 -->
  <div class="content-card fixed-section">
    <h2><img src="rainbow-icon.png" alt="彩虹图标"> 暖心智能体生态系统</h2>
    <p>
      以人为本，专业可靠，即时响应，隐私安全，全生命周期陪伴，为您提供情绪支持与成长引导。
    </p>
    <a href="#" class="learn-more">了解更多</a>
  </div>

  <!-- 分类导航栏 -->
  <div class="category-tabs">
    <button onclick="filterCards('all')" class="tab active">全部</button>
    <button onclick="filterCards('life')" class="tab">人生探索圈</button>
    <button onclick="filterCards('career')" class="tab">学习职场圈</button>
    <button onclick="filterCards('healing')" class="tab">心理疗愈</button>
  </div>

  <!-- 卡片列表 -->
  <div class="cards-container">

    <!-- 人生探索圈 -->
    <div class="card life">
      <div class="qrcode-container">
        <img src="qrcode-life.png" alt="二维码" class="qrcode">
        <span class="tag section-tag">人生探索圈</span>
      </div>
      <h3>暖义人生意义师</h3>
      <p>帮助你找到属于自己的人生方向，陪你一起寻找答案。</p>
      <a href="https://example.com/life " target="_blank" class="visit-button">访问链接</a>
    </div>

    <!-- 学习职场圈 -->
    <div class="card career">
      <div class="qrcode-container">
        <img src="qrcode-career.png" alt="二维码" class="qrcode">
        <span class="tag section-tag">学习职场圈</span>
      </div>
      <h3>职场规划助手</h3>
      <p>帮你制定职业发展路径，解决工作中的困惑。</p>
      <a href="https://example.com/career " target="_blank" class="visit-button">访问链接</a>
    </div>

    <!-- 心理疗愈 -->
    <div class="card healing">
      <div class="qrcode-container">
        <img src="qrcode-healing.png" alt="二维码" class="qrcode">
        <span class="tag section-tag">心理疗愈</span>
      </div>
      <h3>心灵疗愈小屋</h3>
      <p>提供情绪疏导、放松训练、冥想练习等心理服务。</p>
      <a href="https://example.com/healing " target="_blank" class="visit-button">访问链接</a>
    </div>

  </div>

  <script>
    function filterCards(category) {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        if (category === 'all' || card.classList.contains(category)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });

      // 更新 tab 样式
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
    }

    // 默认显示全部
    window.onload = () => filterCards('all');
  </script>
</body>
</html>
